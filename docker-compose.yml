services:
  backend:
    build: ./backend
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      PORT: 5000
    expose:
      - "5000"

  frontend:
    build: ./frontend
    container_name: portfolio-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend